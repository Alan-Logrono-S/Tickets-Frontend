<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesion</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body id="body-login">
    <main id="login-main">
        <section id="seccion-login">
            <h1>Inicio de Sesion</h1>
            <form id="form-login">
                <div class="input-login">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="input-login">
                    <label for="password">Clave</label>
                    <input type="password" id="password" required placeholder="******" minlength="6">
                </div>
                <button id="btn-login">Ingresar</button>
            </form>
            <div id="mensajeError" class="errorHiden"></div>
        </section>
    </main>
    <script type="module" src="/login.js"></script>
</body>
</html>
