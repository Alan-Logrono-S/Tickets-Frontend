<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Tickets Asistencia Tecnica</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div>
            <section>
                <div>
                    <span id="bienvenida-user"></span>
                    <button onclick="logout()" id="btn-logout">Cerra Sesion</button>
                </div>
            </section>

            <nav>
                <button onclick="seleccionar('clientes')">Clientes</button>
                <button onclick="seleccionar('tecnicos')">Tecnicos</button>
                <button onclick="seleccionar('tickets')">Tickets</button>
            </nav>
        </div>
    </header>
    <div>
        <main>
            <!--CLIENTES-->
            <section id="sec-clientes" class="modulo">
                <h1>Seccion Clientes</h1>
                <form id="form-clientes">
                    <input type="hidden" id="cli._id">
                    <input type="text" id="cli-cedula" required placeholder="Cedula">
                    <input type="text" id="cli-nombre" required placeholder="Nombre">
                    <input type="text" id="cli-apellido" required placeholder="Apellido">
                    <input type="text" id="cli-ciudad" required placeholder="Ciudad">
                    <input type="text" id="cli-email" required placeholder="Email">
                    <input type="text" id="cli-direccion" required placeholder="Direccion">
                    <input type="text" id="cli-telefono" required placeholder="Telefono">
                    <div class="into-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" id="cli-fecha" required>
                     </div>
                    <input type="text" id="cli-dependencia" required placeholder="Dependencia">

                    <button id="btn-save">Ingresar Informacion</button>
                </form>
                <table>
                    <thead>
                        <tr>
                            <th>Cedula</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Ciudad</th>
                            <th>Email</th>
                            <th>Direccion</th>
                            <th>Telefono</th>
                            <th>Fecha Nacimiento</th>
                            <th>Dependencia</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-clientes"></tbody>
                </table>
            </section>


            <!--TECNICOS-->
            <section id="sec-tecnicos" class="modulo" style="display: none;">
                <h1>Seccion Tecnicos</h1>
                <form id="form-tecnicos">
                    <input type="hidden" id="tec._id">
                    <input type="text" id="tec-nombre" required placeholder="Nombre">
                    <input type="text" id="tec-apellido" required placeholder="Apellido">
                    <input type="text" id="tec-cedula" required placeholder="Cedula">
                    <div class="into-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" id="tec-fecha" required>
                    </div>
                    <input type="text" id="tec-genero" required placeholder="Genero">
                    <input type="text" id="tec-ciudad" required placeholder="Ciudad">
                    <input type="text" id="tec-direccion" required placeholder="Direccion">
                    <input type="text" id="tec-telefono" required placeholder="Telefono">
                    <input type="text" id="tec-email" required placeholder="Email">

                    <button id="btn-save">Ingresar Informacion</button>
                </form>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Cedula</th>
                            <th>Fecha Nacimiento</th>
                            <th>Genero</th>
                            <th>Ciudad</th>
                            <th>Direccion</th>
                            <th>Telefono</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-tecnicos"></tbody>
                </table>
            </section>


            <!--TICKETS-->
            <section id="sec-tickets" class="modulo" style="display: none;">
                <h1>Seccion Tickets</h1>
                <form id="form-tickets">
                    <input type="hidden" id="tic._id">
                    <input type="text" id="tic-codigo" required placeholder="Codigo">
                    <!-- <input type="text" id="tic-descripcion" required placeholder="Descripcion">
                   -->
                    <textarea id="tic-descripcion" required placeholder="Descripcion"></textarea>
                    
                    <select id="tic-tecnico" required><option value="">Seleccionar Tecnico</option></select>
                    <select id="tic-cliente" required><option value="">Seleccionar Cliente</option></select>

                    <button id="btn-save">Ingresar Informacion</button>
                </form>
                <table>
                    <thead>
                        <tr>
                            <th>Codigo</th>
                            <th>Descripcion</th>
                            <th>id_tecnico</th>
                            <th>id_cliente</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-tickets"></tbody>
                </table>
            </section>
        </main>
    </div>
</body>
<script src="/dashboard.js"></script>
</html>
